name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node.js ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install pinned parser dependency
        run: npm ci --ignore-scripts
      - name: Run deterministic tests
        run: npm test
      - name: Smoke test AST CLI
        run: node ./bin/ghostproof.mjs scan ./examples --format json > /tmp/ghostproof-report.json
      - name: Validate isolated E1 demos
        run: node ./bin/ghostproof.mjs experiment --all --format json > /tmp/ghostproof-mechanisms.json
      - name: Validate bundled E2 and E3 proof demo
        run: node ./bin/ghostproof.mjs proof BW001 --format json > /tmp/ghostproof-project-proof.json
      - name: Verify bundled evidence integrity and replay
        run: node ./bin/ghostproof.mjs verify /tmp/ghostproof-project-proof.json --format json > /tmp/ghostproof-verification.json
      - name: Verify productive source scan
        run: npm run check

  pinned-e0:
    name: Fixed-commit real public source scan (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scan pinned source files as data (verify blob before scanning)
        run: node ./bin/ghostproof.mjs study --format json > pinned-e0-report.json
      - name: Validate pinned E0 result
        run: node -e "const r = require('./pinned-e0-report.json'); if(r.kind !== 'pinned-public-e0-study' || r.summary.scannedFiles !== 2 || r.summary.confirmed !== 0) process.exit(1);"
      - uses: actions/upload-artifact@v4
        with:
          name: ghostproof-pinned-e0
          path: pinned-e0-report.json
          retention-days: 7

  platform-smoke:
    name: Installation and CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Validate command line contract
        run: node --test tests/cli.test.mjs
      - name: Check package contents without publishing
        run: npm pack --dry-run --ignore-scripts

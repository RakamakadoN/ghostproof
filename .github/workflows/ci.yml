name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Node.js ${{ matrix.node }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run deterministic tests
        run: npm test
      - name: Smoke test CLI
        run: node ./bin/ghostproof.mjs scan ./examples --format json > /tmp/ghostproof-report.json
